version: 1
kind: pipeline
name: ci

tools:
  node: "24.16.0"
  gitleaks: "8.18.4"
  pnpm: "11.3.0"

steps:
  # This repository is public: a secret that reaches main is published and must be revoked, not deleted.
  - name: gitleaks
    tools: [gitleaks]
    run: |
      if git rev-parse --git-dir >/dev/null 2>&1; then
        gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --exit-code 1
      else
        gitleaks detect --no-git --source . --config .gitleaks.toml --no-banner --redact --exit-code 1
      fi

  - name: editor
    tools: [node]
    run: |
      CI=true npx -y pnpm@11.3.0 install --frozen-lockfile
      npx -y pnpm@11.3.0 test
      npx -y pnpm@11.3.0 typecheck
      npx -y pnpm@11.3.0 build
