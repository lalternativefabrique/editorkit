[package]
name = "kertas-wasm"
description = "JSON-in/JSON-out wasm ABI over kertas, loadable by browsers and by wazero"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kertas = { path = "../kertas" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
