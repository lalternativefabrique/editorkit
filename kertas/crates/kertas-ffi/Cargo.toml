[package]
name = "kertas-ffi"
description = "C ABI over kertas for native hosts: the Expo module on iOS and Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
kertas = { path = "../kertas" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
