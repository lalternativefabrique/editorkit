[workspace]
resolver = "3"
members = ["crates/kertas", "crates/kertas-wasm", "crates/kertas-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
